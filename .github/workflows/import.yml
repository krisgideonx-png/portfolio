name: Import content
on:
  push: { branches: [ main ] }
  workflow_dispatch:
permissions: { contents: write }
jobs:
  import:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'import-skip') }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - env:
          SRC_ZIP: "https://static.teamily.ai/files/25fc3370-c522-457f-97d5-4359ef7f0e37/portfolio_v3.zip?tk=ZmlsZToyNWZjMzM3MC1jNTIyLTQ1N2YtOTdkNS00MzU5ZWY3ZjBlMzc6MTc5MzcwNzU4NQ.NGM0ZTNmMzdmN2NkMmZjMWNlMzBlMTRjNTkxNjA3MGM"
        run: |
          set -euo pipefail
          curl -fL --retry 5 -o /tmp/content.zip "$SRC_ZIP"
          mkdir -p /tmp/raw && unzip -q -o /tmp/content.zip -d /tmp/raw
          CAND="$(find /tmp/raw -maxdepth 3 -name index.html -printf '%h\n' | head -n1)"
          [ -z "$CAND" ] && CAND="/tmp/raw"
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a "$CAND"/. .
          git config user.name "Agent" && git config user.email "agent@example.com"
          git add -A && git commit -m "Add four new projects to portfolio [import-skip]"
          git push origin HEAD:main
          git rm .github/workflows/import.yml && git commit -m "chore: remove temp import workflow" && git push origin HEAD:main
