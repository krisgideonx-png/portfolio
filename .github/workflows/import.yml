name: Import content
on:
  push: { branches: [ main ] }
  workflow_dispatch:
permissions: { contents: write }
jobs:
  import:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'import-skip') }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - env:
          SRC_ZIP: "https://static.teamily.ai/sites/c4a7ee44-96ba-4d7b-9549-d632d610807a/documents/portfolio-site.zip"
        run: |
          set -euo pipefail
          curl -fL --retry 5 -o /tmp/content.zip "$SRC_ZIP"
          mkdir -p /tmp/raw && unzip -q -o /tmp/content.zip -d /tmp/raw
          CAND="$(find /tmp/raw -maxdepth 3 -name index.html -printf '%h\n' | head -n1)"
          [ -z "$CAND" ] && CAND="/tmp/raw"
          echo "Using source dir: $CAND"
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a "$CAND"/. .
          git config user.name "Agent" && git config user.email "agent@example.com"
          git add -A && git commit -m "Import portfolio site [import-skip]"
          git push origin HEAD:main
          git rm .github/workflows/import.yml && git commit -m "chore: remove temp import workflow" && git push origin HEAD:main
